[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.7",
    "fire>=0.7.1",
    "numpy>=2.5.4",
    "pydantic>=2.13.5",
    "rank-bm25>=0.2.2",
    "rich>=14.0.0",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "transformers>=5.20.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag = "rag:main"

[tool.mypy]
exclude = [
    "^data/raw/",
    "^.venv/",
    "^tests/",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "autopep8>=2.3.2",
    "flake8>=7.5.0",
    "mypy>=2.4.1",
]

[[tool.mypy.overrides]]
module = ["transformers.*", "sentence_transformers.*", "torch.*"]
follow_imports = "skip"
